<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Welcome</title>
  <style>
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      background: radial-gradient(circle at 20% 20%, #72edf2, transparent 30%),
                  radial-gradient(circle at 80% 80%, #6a85f1, transparent 35%),
                  #f8fafc;
    }
    .box{
      background:#fff;
      padding:24px 28px;
      border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.1);
      text-align:center;
    }
    h1{ margin:0; font-size:30px; }
    p{ color:#6b7280; margin-top:6px; }
  </style>
</head>
<body>
  <div class="box">
    <h1 id="greet">Welcome User!</h1>
    <p>This page reads your name from the URL (GET params).</p>
  </div>

  <script>
    // Read query parameters like ?fname=John&lname=Doe
    const params = new URLSearchParams(window.location.search);
    const first = params.get('fname');
    const last = params.get('lname');
    if(first){
      const name = last ? first + ' ' + last : first;
      document.getElementById('greet').textContent = 'Welcome ' + name + '!';
    }
  </script>
</body>
</html>

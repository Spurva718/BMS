<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>User Registration Form</title>

  <!-- Our custom styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- (Optional, for later) Bootstrap CSS CDN - keep commented until you want it -->
  <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body>
  <main class="page">
    <section class="form-card">
      <h1>User Registration</h1>
      <p class="lead">All fields are required.</p>

      <!-- GET for now; change to POST later when you have a server endpoint -->
      <form action="welcome.html" method="get" autocomplete="on" novalidate>
        <div class="grid">
          <div class="field">
            <label for="fname">First Name *</label>
            <input type="text" id="fname" name="fname" pattern="[A-Za-z]+"
                   placeholder="Enter first name" required>
            <small class="hint">Alphabets only</small>
          </div>

          <div class="field">
            <label for="lname">Last Name *</label>
            <input type="text" id="lname" name="lname" pattern="[A-Za-z]+"
                   placeholder="Enter last name" required>
            <small class="hint">Alphabets only</small>
          </div>

          <div class="field full">
            <span class="label">Gender *</span>
            <div class="options">
              <label><input type="radio" name="gender" value="Male" required> Male</label>
              <label><input type="radio" name="gender" value="Female"> Female</label>
              <label><input type="radio" name="gender" value="Others"> Others</label>
            </div>
          </div>

          <div class="field full">
            <span class="label">Languages Known * (pick at least one)</span>
            <div class="options">
              <label><input type="checkbox" name="langs" value="HTML" required> HTML</label>
              <label><input type="checkbox" name="langs" value="CSS"> CSS</label>
              <label><input type="checkbox" name="langs" value="JS"> JS</label>
            </div>
          </div>

          <div class="field">
            <label for="address">Address *</label>
            <select id="address" name="address" required>
              <option value="" selected disabled>-- Select --</option>
              <option value="Bangalore">Bangalore</option>
              <option value="Mysore">Mysore</option>
              <option value="Kerala">Kerala</option>
            </select>
          </div>

          <div class="field">
            <label for="cities">Cities lived in *</label>
            <input type="text" id="cities" name="cities"
                   placeholder="e.g., Chennai, Pune" required>
          </div>

          <div class="field">
            <label for="contact">Contact Number *</label>
            <input type="tel" id="contact" name="contact" pattern="[0-9]{10}"
                   inputmode="numeric" placeholder="10 digit number" required>
            <small class="hint">Exactly 10 digits</small>
          </div>

          <div class="field">
            <label for="color">My favorite color is *</label>
            <input type="color" id="color" name="color" required>
          </div>

          <div class="field">
            <label for="date">Date *</label>
            <input type="date" id="date" name="date" required>
          </div>

          <div class="field">
            <label for="birthday">Birthday *</label>
            <input type="date" id="birthday" name="birthday" required>
          </div>

          <div class="field">
            <label for="time">Time is *</label>
            <input type="time" id="time" name="time" required>
          </div>

          <div class="field">
            <label for="week">Week is *</label>
            <input type="week" id="week" name="week" required>
          </div>

          <div class="field">
            <label for="month">Month is *</label>
            <input type="month" id="month" name="month" required>
          </div>

          <div class="field full">
            <label for="email">Email ID *</label>
            <input type="email" id="email" name="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn submit">Submit</button>
          <button type="reset" class="btn reset">Reset</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>

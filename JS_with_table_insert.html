<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Form</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="container">
    <h2 class="mb-4">Add Customer</h2>

    <!-- Form -->
    <div class="card p-4">
      <div class="mb-3">
        <label class="form-label">Name:</label>
        <input type="text" id="name" class="form-control">
        <small class="text-danger" id="nameError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Id:</label>
        <input type="text" id="email" class="form-control">
        <small class="text-danger" id="emailError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Contact No:</label>
        <input type="text" id="contact" class="form-control">
        <small class="text-danger" id="contactError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Account Type:</label>
        <select id="accountType" class="form-select">
          <option value="">--Select--</option>
          <option value="savings">Savings</option>
          <option value="current">Current</option>
        </select>
        <small class="text-danger" id="accountError"></small>
      </div>

      <button class="btn btn-primary" onclick="addCustomer()">Add Customer</button>
    </div>

    <!-- Table -->
    <h3 class="mt-5">Customer List</h3>
    <table class="table table-bordered mt-3">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Contact</th>
          <th>Account Type</th>
        </tr>
      </thead>
      <tbody id="customerTable">
        <!-- Data will be added here -->
      </tbody>
    </table>
  </div>

  <script>
    function addCustomer() {
      // Get input values
      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let contact = document.getElementById("contact").value.trim();
      let account = document.getElementById("accountType").value;

      // Error elements
      let nameError = document.getElementById("nameError");
      let emailError = document.getElementById("emailError");
      let contactError = document.getElementById("contactError");
      let accountError = document.getElementById("accountError");

      // Clear old errors
      nameError.textContent = "";
      emailError.textContent = "";
      contactError.textContent = "";
      accountError.textContent = "";

      let isValid = true;

      // Validation
      if (!/^[A-Za-z ]+$/.test(name)) {
        nameError.textContent = "Please enter only alphabets";
        isValid = false;
      }

      if (!/^[\w.-]+@[a-zA-Z]+\.[a-zA-Z]{2,}$/.test(email)) {
        emailError.textContent = "Invalid email address";
        isValid = false;
      }

      if (!/^[789]\d{9}$/.test(contact)) {
        contactError.textContent = "Contact must be 10 digits & start with 7,8,9";
        isValid = false;
      }

      if (account === "") {
        accountError.textContent = "Please select account type";
        isValid = false;
      }

      // If valid → Add to table
      if (isValid) {
        let table = document.getElementById("customerTable");
        let newRow = table.insertRow();

        newRow.insertCell(0).textContent = name;
        newRow.insertCell(1).textContent = email;
        newRow.insertCell(2).textContent = contact;
        newRow.insertCell(3).textContent = account;

        // Reset form
        document.getElementById("name").value = "";
        document.getElementById("email").value = "";
        document.getElementById("contact").value = "";
        document.getElementById("accountType").value = "";
      }
    }
  </script>

</body>
</html>

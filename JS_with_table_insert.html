<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Form with JS Concepts</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(120deg, #f0f4f7, #e3f2fd);
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    .card {
      border-radius: 15px;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
    }
    .card h2 {
      color: #0d47a1;
    }
    .table {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0px 4px 12px rgba(0,0,0,0.08);
    }
    .btn-custom {
      border-radius: 25px;
      font-weight: bold;
    }
  </style>
</head>
<body class="p-4">

  <div class="container">
    <h2 class="text-center mb-4 fw-bold text-primary">📝 Add New Customer</h2>

    <!-- Form -->
    <form id="customerForm" class="card p-4 mb-5">
      <div class="mb-3">
        <label class="form-label">Name:</label>
        <input type="text" id="name" class="form-control">
        <small class="text-danger" id="nameError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Id:</label>
        <input type="text" id="email" class="form-control">
        <small class="text-danger" id="emailError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Contact No:</label>
        <input type="text" id="contact" class="form-control">
        <small class="text-danger" id="contactError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Account Type:</label>
        <select id="accountType" class="form-select">
          <option value="">--Select--</option>
          <option value="Savings">Savings</option>
          <option value="Current">Current</option>
        </select>
        <small class="text-danger" id="accountError"></small>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-custom">Add Customer</button>
    </form>

    <!-- Table -->
    <h3 class="mb-3 text-secondary">👥 Customer List</h3>
    <table class="table table-bordered text-center">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Contact</th>
          <th>Account Type</th>
        </tr>
      </thead>
      <tbody id="customerTable"></tbody>
    </table>
  </div>

  <script>
    // ================= CLASS =================
    class Customer {
      constructor(name, email, contact, accountType) {
        this.name = name;
        this.email = email;
        this.contact = contact;
        this.accountType = accountType;
      }
    }

    // ================= SELECT ELEMENTS =================
    const form = document.getElementById("customerForm");
    const customerTable = document.getElementById("customerTable");

    // ================= CLEAR ERRORS (Arrow Function) =================
    const clearErrors = () => {
      document.querySelectorAll("small.text-danger").forEach(el => el.textContent = "");
    };

    // ================= VALIDATION =================
    const validateInputs = (name, email, contact, account) => {
      let isValid = true;

      if (!/^[A-Za-z ]+$/.test(name)) {
        document.getElementById("nameError").textContent = "Please enter only alphabets";
        isValid = false;
      }
      // !/^[\\w.-]+@[a-zA-Z]+\\.[a-zA-Z]{2,}$/i -->
      if (!/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(email)) {
        document.getElementById("emailError").textContent = "Invalid email address";
        isValid = false;
      }
      
      if (!/^[789]\d{9}$/.test(contact)) {
        document.getElementById("contactError").textContent = "Contact must be 10 digits & start with 7,8,9";
        isValid = false;
      }
      if (account === "") {
        document.getElementById("accountError").textContent = "Please select account type";
        isValid = false;
      }

      return isValid;
    };

    // ================= ADD TO TABLE =================
    const addCustomerToTable = (customer) => {
      const row = document.createElement("tr");
      [customer.name, customer.email, customer.contact, customer.accountType].forEach(text => {
        const cell = document.createElement("td");
        cell.textContent = text;
        row.appendChild(cell);
      });
      customerTable.appendChild(row);
    };

    // ================= EVENT LISTENER =================
    form.addEventListener("submit", (event) => {
      event.preventDefault(); // prevent page reload
      clearErrors();

      // Get values
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const account = document.getElementById("accountType").value;

      // If valid → create object → add to table
      if (validateInputs(name, email, contact, account)) {
        const newCustomer = new Customer(name, email, contact, account);
        addCustomerToTable(newCustomer);
        form.reset();
      }
    });
  </script>

</body>
</html>

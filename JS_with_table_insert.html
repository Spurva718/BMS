<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Form with JS Concepts</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

  <div class="container">
    <h2 class="mb-4">Add Customer</h2>

    <!-- Form -->
    <form id="customerForm" class="card p-4">
      <div class="mb-3">
        <label class="form-label">Name:</label>
        <input type="text" id="name" class="form-control">
        <small class="text-danger" id="nameError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Email Id:</label>
        <input type="text" id="email" class="form-control">
        <small class="text-danger" id="emailError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Contact No:</label>
        <input type="text" id="contact" class="form-control">
        <small class="text-danger" id="contactError"></small>
      </div>

      <div class="mb-3">
        <label class="form-label">Account Type:</label>
        <select id="accountType" class="form-select">
          <option value="">--Select--</option>
          <option value="savings">Savings</option>
          <option value="current">Current</option>
        </select>
        <small class="text-danger" id="accountError"></small>
      </div>

      <button type="submit" class="btn btn-primary">Add Customer</button>
    </form>

    <!-- Table -->
    <h3 class="mt-5">Customer List</h3>
    <table class="table table-bordered mt-3">
      <thead class="table-dark">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Contact</th>
          <th>Account Type</th>
        </tr>
      </thead>
      <tbody id="customerTable"></tbody>
    </table>
  </div>

  <script>
    // Class for Customer
    class Customer {
      constructor(name, email, contact, accountType) {
        this.name = name;
        this.email = email;
        this.contact = contact;
        this.accountType = accountType;
      }
    }

    // Select elements
    const form = document.getElementById("customerForm");
    const customerTable = document.getElementById("customerTable");

    // Arrow function for clearing errors
    const clearErrors = () => {
      document.querySelectorAll("small.text-danger").forEach(el => el.textContent = "");
    };

    // Validation function (returns true/false)
    const validateInputs = (name, email, contact, account) => {
      let isValid = true;

      if (!/^[A-Za-z ]+$/.test(name)) {
        document.getElementById("nameError").textContent = "Please enter only alphabets";
        isValid = false;
      }

      if (!/^[\w.-]+@[a-zA-Z]+\.[a-zA-Z]{2,}$/.test(email)) {
        document.getElementById("emailError").textContent = "Invalid email address";
        isValid = false;
      }

      if (!/^[789]\d{9}$/.test(contact)) {
        document.getElementById("contactError").textContent = "Contact must be 10 digits & start with 7,8,9";
        isValid = false;
      }

      if (account === "") {
        document.getElementById("accountError").textContent = "Please select account type";
        isValid = false;
      }

      return isValid;
    };

    // Function to add customer row to table
    const addCustomerToTable = (customer) => {
      const row = document.createElement("tr");

      [customer.name, customer.email, customer.contact, customer.accountType].forEach(text => {
        const cell = document.createElement("td");
        cell.textContent = text;
        row.appendChild(cell);
      });

      customerTable.appendChild(row);
    };

    // Event Listener for form submit
    form.addEventListener("submit", (event) => {
      event.preventDefault(); // prevent page reload

      clearErrors();

      // Get values
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const contact = document.getElementById("contact").value.trim();
      const account = document.getElementById("accountType").value;

      if (validateInputs(name, email, contact, account)) {
        // Create new customer object
        const newCustomer = new Customer(name, email, contact, account);

        // Add to table
        addCustomerToTable(newCustomer);

        // Reset form
        form.reset();
      }
    });
  </script>

</body>
</html>

<!DOCTYPE html> <!-- tells the browser this is an HTML5 document -->
<html lang="en"> <!-- page language is English -->
<head>
  <meta charset="UTF-8"> <!-- supports all common characters -->
  <meta name="viewport" content="width=device-width, initial-scale=1"> <!-- responsive on phones -->
  <title>Facebook Login Clone</title> <!-- tab title -->

  <!-- Bootstrap CSS from the CDN: gives us the grid, buttons, forms, etc. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style> /* small custom styles to match the look */
    body {
      background-color: #f0f2f5; /* light gray page background */
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; /* clean system fonts */
    }
    .brand {
      font-size: 56px;         /* big “facebook” text */
      font-weight: 800;        /* very bold */
      color: #1877f2;          /* Facebook blue */
      letter-spacing: -0.5px;  /* squeeze letters a bit */
    }
    .tagline {
      font-size: 24px;         /* larger paragraph text under the logo */
      max-width: 500px;        /* keep it from getting too wide */
    }
    .card {
      border-radius: 10px;                /* rounded corners for the login box */
      box-shadow: 0 2px 12px rgba(0,0,0,.1); /* soft shadow to lift it */
    }
    .btn-success {               /* override Bootstrap’s green to match Facebook’s */
      background-color: #42b72a;
    }
    .create-page {
      font-size: 14px;           /* small text below the card */
      color: #606770;            /* muted gray */
      margin-top: 20px;          /* space above */
      text-align: center;        /* center it */
    }
    .create-page a {
      font-weight: 700;          /* bold for the “Create a Page” link */
      color: black;              /* black link text */
      text-decoration: none;     /* remove underline */
    }
    .create-page a:hover {
      text-decoration: underline; /* underline on hover for accessibility */
    }
  </style>
</head>
<body>
  <!-- full-height container; center content both ways -->
  <div class="container min-vh-100 d-flex align-items-center justify-content-center">
    <!-- a Bootstrap row that spans the page width we have -->
    <div class="row w-100 align-items-center">
      
      <!-- LEFT: brand & tagline -->
      <!-- col-lg-6 = half width on large screens; full width on small screens automatically -->
      <div class="col-lg-6 mb-5 mb-lg-0 text-center text-lg-start">
        <h1 class="brand">facebook</h1> <!-- big blue wordmark -->
        <p class="tagline">Facebook helps you connect and share with the people in your life.</p> <!-- tagline -->
      </div>

      <!-- RIGHT: login card -->
      <div class="col-lg-6">
        <div class="card p-4"> <!-- white card with padding -->
          <form> <!-- form wrapper; you can add action/method later -->
            <!-- email/phone input -->
            <div class="mb-3"> <!-- margin-bottom spacing helper -->
              <input
                type="text"
                class="form-control form-control-lg"
                placeholder="Email address or phone number"
                required> <!-- HTML validation -->
            </div>

            <!-- password input -->
            <div class="mb-3">
              <input
                type="password"
                class="form-control form-control-lg"
                placeholder="Password"
                required>
            </div>

            <!-- login button: full width because of d-grid on parent -->
            <div class="d-grid"> <!-- makes the button stretch to 100% width -->
              <button type="submit" class="btn btn-primary btn-lg">Log in</button>
            </div>

            <!-- forgot link, centered with Bootstrap text utilities -->
            <div class="text-center my-3"> <!-- vertical margin y-axis -->
              <a href="#" class="text-decoration-none">Forgotten password?</a>
            </div>

            <hr> <!-- a horizontal divider line -->

            <!-- green create-account button, centered -->
            <div class="d-flex justify-content-center">
              <button type="button" class="btn btn-success btn-lg">Create new account</button>
            </div>
          </form>
        </div>

        <!-- small note under the card -->
        <p class="create-page">
          <a href="#">Create a Page</a> for a celebrity, brand or business.
        </p>
      </div>
    </div>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer & Testimonial Page</title>
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

<div class="container">
  <!-- ================= Customer Section ================= -->
  <h2 class="mb-4">Add Customer</h2>
  <form id="customerForm" class="card p-4 mb-5">
    <div class="mb-3">
      <label class="form-label">Name:</label>
      <input type="text" id="name" class="form-control">
      <small class="text-danger" id="nameError"></small>
    </div>

    <div class="mb-3">
      <label class="form-label">Email Id:</label>
      <input type="text" id="email" class="form-control">
      <small class="text-danger" id="emailError"></small>
    </div>

    <div class="mb-3">
      <label class="form-label">Contact No:</label>
      <input type="text" id="contact" class="form-control">
      <small class="text-danger" id="contactError"></small>
    </div>

    <div class="mb-3">
      <label class="form-label">Account Type:</label>
      <select id="accountType" class="form-select">
        <option value="">--Select--</option>
        <option value="savings">Savings</option>
        <option value="current">Current</option>
      </select>
      <small class="text-danger" id="accountError"></small>
    </div>

    <button type="submit" class="btn btn-primary">Add Customer</button>
  </form>

  <h3>Customer List</h3>
  <table class="table table-bordered mt-3">
    <thead class="table-dark">
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Contact</th>
        <th>Account Type</th>
      </tr>
    </thead>
    <tbody id="customerTable"></tbody>
  </table>

  <!-- ================= Testimonial Section ================= -->
  <h2 class="mt-5">Add Testimonial</h2>
  <form id="testimonialForm" class="card p-4 mb-4">
    <div class="mb-3">
      <label class="form-label">Name</label>
      <input type="text" id="tName" class="form-control" placeholder="Your Name">
    </div>
    <div class="mb-3">
      <label class="form-label">Message</label>
      <textarea id="tMessage" class="form-control" placeholder="Enter your Message"></textarea>
    </div>
    <button type="submit" class="btn btn-warning">Submit</button>
  </form>

  <h3>Testimonials</h3>
  <div id="testimonialList"></div>
</div>

<script>
  // ================= CUSTOMER CLASS =================
  class Customer {
    constructor(name, email, contact, accountType) {
      this.name = name;
      this.email = email;
      this.contact = contact;
      this.accountType = accountType;
    }
  }

  // Elements
  const customerForm = document.getElementById("customerForm");
  const customerTable = document.getElementById("customerTable");

  const clearCustomerErrors = () => {
    document.querySelectorAll("#customerForm small.text-danger").forEach(el => el.textContent = "");
  };

  const validateCustomer = (name, email, contact, account) => {
    let isValid = true;
    if (!/^[A-Za-z ]+$/.test(name)) {
      document.getElementById("nameError").textContent = "Only alphabets allowed";
      isValid = false;
    } 
    /^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i
    if (!/^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(email)) {
      document.getElementById("emailError").textContent = "Invalid email format";
      isValid = false;
    }

    if (!/^[789]\d{9}$/.test(contact)) {
      document.getElementById("contactError").textContent = "Must be 10 digits, start with 7/8/9";
      isValid = false;
    }
    if (account === "") {
      document.getElementById("accountError").textContent = "Please select account type";
      isValid = false;
    }
    return isValid;
  };

  const addCustomerToTable = (customer) => {
    const row = document.createElement("tr");
    [customer.name, customer.email, customer.contact, customer.accountType].forEach(text => {
      const cell = document.createElement("td");
      cell.textContent = text;
      row.appendChild(cell);
    });
    customerTable.appendChild(row);
  };

  customerForm.addEventListener("submit", (e) => {
    e.preventDefault();
    clearCustomerErrors();
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const contact = document.getElementById("contact").value.trim();
    const account = document.getElementById("accountType").value;

    if (validateCustomer(name, email, contact, account)) {
      const newCustomer = new Customer(name, email, contact, account);
      addCustomerToTable(newCustomer);
      customerForm.reset();
    }
  });

  // ================= TESTIMONIAL CLASS =================
  class Testimonial {
    constructor(name, message) {
      this.name = name;
      this.message = message;
    }
  }

  const testimonialForm = document.getElementById("testimonialForm");
  const testimonialList = document.getElementById("testimonialList");

  const createTestimonialCard = (testimonial) => {
    const card = document.createElement("div");
    card.className = "card p-3 mb-3 border-success";

    const nameEl = document.createElement("h5");
    nameEl.textContent = testimonial.name;
    const msgEl = document.createElement("p");
    msgEl.textContent = testimonial.message;

    const btnGroup = document.createElement("div");
    const editBtn = document.createElement("button");
    editBtn.className = "btn btn-sm btn-primary me-2";
    editBtn.textContent = "Edit";

    const delBtn = document.createElement("button");
    delBtn.className = "btn btn-sm btn-danger";
    delBtn.textContent = "Delete";

    // Edit
    editBtn.addEventListener("click", () => {
      document.getElementById("tName").value = testimonial.name;
      document.getElementById("tMessage").value = testimonial.message;
      testimonialList.removeChild(card);
    });

    // Delete
    delBtn.addEventListener("click", () => {
      testimonialList.removeChild(card);
    });

    btnGroup.appendChild(editBtn);
    btnGroup.appendChild(delBtn);

    card.appendChild(nameEl);
    card.appendChild(msgEl);
    card.appendChild(btnGroup);

    testimonialList.appendChild(card);
  };

  testimonialForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = document.getElementById("tName").value.trim();
    const message = document.getElementById("tMessage").value.trim();

    if (name && message) {
      const newTestimonial = new Testimonial(name, message);
      createTestimonialCard(newTestimonial);
      testimonialForm.reset();
    }
  });
</script>
</body>
</html>
